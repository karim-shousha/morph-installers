name: Mirror installer binaries only
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Copy and verify current installation packages
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_INVENTORY: 
        run: |
          python3 - <<'PY'
          import os,json,base64,hashlib,http.client,urllib.request,urllib.error,urllib.parse,tempfile,time,concurrent.futures,threading
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];token=os.environ['GH_TOKEN'];inventory=json.loads(base64.b64decode(os.environ['INSTALLER_INVENTORY']));tag='current-installers-2026-11-21'
          def api(path,method='GET',body=None):
           data=None if body is None else json.dumps(body).encode();req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=data,method=method,headers={'Authorization':'Bearer '+token,'User-Agent':'Morph-Installer-Mirror','Content-Type':'application/json'})
           with urllib.request.urlopen(req,timeout=120) as r:return json.load(r)
          try:release=api('releases/tags/'+tag)
          except urllib.error.HTTPError as e:
           if e.code!=404:raise
           release=api('releases','POST',dict(tag_name=tag,target_commitish='main',name='Current Morph installers',body='Installation packages only. No application source archives.',draft=False,prerelease=False))
          assets={a['name']:a for a in api('releases/'+str(release['id'])+'/assets?per_page=100')};lock=threading.Lock();results=[]
          def mirror(row):
           name=row['file'];assert '/' not in name and '\\' not in name and 'source' not in name.lower();asset=assets.get(name)
           if asset is None:
            with tempfile.TemporaryDirectory(prefix='morph-installer-') as folder:
             file=Path(folder)/name
             for attempt in range(3):
              try:
               digest=hashlib.sha256();size=0
               with urllib.request.urlopen(urllib.request.Request(row['url'],headers={'User-Agent':'Morph-Installer-Migration-Bot'}),timeout=180) as r,file.open('wb') as out:
                while True:
                 chunk=r.read(1048576)
                 if not chunk:break
                 size+=len(chunk);assert size<=row['bytes'];out.write(chunk);digest.update(chunk)
               assert size==row['bytes'] and digest.hexdigest()==row['sha256'],name
               break
              except Exception:
               if attempt==2:raise
               time.sleep(3*(attempt+1))
             uri=urllib.parse.urlsplit(release['upload_url'].split('{')[0]+'?name='+urllib.parse.quote(name));connection=http.client.HTTPSConnection(uri.hostname,timeout=300)
             with file.open('rb') as body:
              connection.request('POST',uri.path+'?'+uri.query,body=body,headers={'Authorization':'Bearer '+token,'User-Agent':'Morph-Installer-Mirror','Content-Type':'application/octet-stream','Content-Length':str(size)});response=connection.getresponse();data=response.read();assert response.status==201,(name,response.status);asset=json.loads(data)
             connection.close()
           assert asset['size']==row['bytes'] and asset['digest']=='sha256:'+row['sha256'],name
           result=dict(file=name,bytes=row['bytes'],sha256=row['sha256'],sourceUrl=row['url'],url=asset['browser_download_url'])
           with lock:results.append(result);print('VERIFIED '+str(len(results))+'/'+str(len(inventory))+' '+name,flush=True)
           return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(mirror,inventory))
          result=dict(passed=True,repository=repo,tag=tag,installersOnly=True,count=len(results),bytes=sum(x['bytes'] for x in results),assets=sorted(results,key=lambda x:x['file']))
          content=base64.b64encode(json.dumps(result,indent=2).encode()).decode();data=dict(message='Record verified installer-only mirror',content=content,branch='main')
          try:data['sha']=api('contents/mirror-result.json')['sha']
          except urllib.error.HTTPError as e:
           if e.code!=404:raise
          api('contents/mirror-result.json','PUT',data);print('COMPLETE verified installer-only mirror',len(results),flush=True)
          PY
